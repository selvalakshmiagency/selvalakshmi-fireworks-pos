<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selvalakshmi Agency | Fireworks POS</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#182235;--muted:#788397;--line:#e8edf4;--nav:#111c31;--gold:#e5ad43;--gold2:#fff3d8;--green:#16845b;--red:#c34c4c;--blue:#315fba;--shadow:0 8px 28px #1b2b4510}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial}.shell{display:flex;min-height:100vh}.sidebar{width:248px;background:var(--nav);color:#e9eef8;padding:22px 15px;display:flex;flex-direction:column;flex-shrink:0}.brand{display:flex;gap:12px;align-items:center;padding:3px 9px 25px;border-bottom:1px solid #ffffff18}.brandmark{height:42px;width:42px;border-radius:13px;background:linear-gradient(135deg,#f5d58d,#b77a1d);display:grid;place-items:center;color:#38270c;font-size:21px;font-weight:900}.brand strong{display:block;font-size:14px;letter-spacing:.4px}.brand small{color:#aab5c8;font-size:11px}.navlabel{color:#8492a9;font-size:10px;letter-spacing:1.4px;font-weight:800;margin:24px 10px 9px}.nav button{border:0;background:none;color:#aeb9cb;width:100%;padding:11px 12px;text-align:left;border-radius:9px;margin:2px 0;cursor:pointer;font:inherit;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#ffffff13;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--gold)}.nav .ico{width:18px;text-align:center;color:var(--gold)}.sidefoot{margin-top:auto;border-top:1px solid #ffffff18;padding:16px 9px 0;color:#9eabc0;font-size:11px}.main{flex:1;min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:4}.crumb{font-weight:750;font-size:17px}.topright{display:flex;align-items:center;gap:16px}.pill{border-radius:99px;background:#eaf7f1;color:var(--green);padding:6px 10px;font-size:11px;font-weight:800}.avatar{height:34px;width:34px;border-radius:50%;display:grid;place-items:center;background:#fff0d0;color:#805715;font-weight:800}.content{padding:28px 32px;max-width:1500px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:22px}.pagehead h1{margin:0 0 5px;font-size:24px;letter-spacing:-.5px}.sub{color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;font-weight:700;color:var(--ink);cursor:pointer}.btn.primary{background:var(--nav);color:#fff;border-color:var(--nav)}.btn.gold{background:var(--gold);border-color:var(--gold);color:#2b210f}.btn.danger{color:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.statlabel{color:var(--muted);font-size:12px;font-weight:650}.statvalue{font-size:26px;font-weight:850;letter-spacing:-.8px;margin:8px 0 3px}.statnote{font-size:11px;color:var(--muted)}.staticon{float:right;width:35px;height:35px;border-radius:10px;background:var(--gold2);display:grid;place-items:center;color:#94620e}.two{grid-template-columns:1.35fr 1fr}.sectiontitle{font-weight:800;font-size:15px;margin:0 0 15px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:var(--muted);font-size:11px;letter-spacing:.4px;font-weight:800;padding:11px 10px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid #f0f2f6;font-size:13px}tr:last-child td{border-bottom:0}.tag{display:inline-block;border-radius:99px;padding:4px 8px;background:#eef2f8;color:#53627a;font-size:10px;font-weight:800}.tag.green{background:#e8f7f0;color:var(--green)}.tag.orange{background:#fff3df;color:#9a6710}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.field{border:1px solid #dfe5ee;border-radius:9px;background:#fff;padding:10px 11px;font:inherit;min-width:0;color:var(--ink)}.field:focus{outline:2px solid #e5ad4355;border-color:var(--gold)}.search{min-width:230px;flex:1}.split{display:grid;grid-template-columns:1.4fr .85fr;gap:16px}.productgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.product{border:1px solid var(--line);border-radius:11px;padding:13px;background:#fff;cursor:pointer;text-align:left}.product:hover{border-color:var(--gold);background:#fffcf5}.product strong{display:block;font-size:13px}.product small{color:var(--muted)}.price{font-weight:850;margin-top:9px}.cartline{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.cartline small{color:var(--muted)}.totals{display:flex;justify-content:space-between;margin:9px 0;color:#536078}.grand{font-size:19px;font-weight:900;color:var(--ink);border-top:1px solid var(--line);padding-top:13px;margin-top:13px}.empty{padding:30px;text-align:center;color:var(--muted)}.drop{border:2px dashed #d9e0ea;border-radius:14px;padding:30px;text-align:center;background:#fbfcfe}.drop.drag{border-color:var(--gold);background:#fffaf0}.drop .big{font-size:30px}.drop h3{margin:8px 0 4px}.drop p{color:var(--muted);margin:0 0 15px}.steps{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.step{padding:7px 10px;border-radius:99px;background:#eef1f6;color:#718097;font-size:11px;font-weight:800}.step.on{background:var(--gold2);color:#855b14}.notice{padding:12px 14px;border-radius:10px;background:#fff7e8;border:1px solid #f2dfb8;color:#74551c;font-size:12px;margin:14px 0}.success{background:#eaf7f0;border-color:#ccebdc;color:#176846}.hidden{display:none!important}.formrow{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.formrow label{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-bottom:5px}.formrow input,.formrow select{width:100%}.footerhint{font-size:11px;color:var(--muted);margin-top:14px}.mobilemenu{display:none}
.qtyctl{width:58px;padding:5px;border:1px solid #dfe5ee;border-radius:7px;text-align:center;font:inherit}.linedisc{width:76px;padding:5px;border:1px solid #dfe5ee;border-radius:7px;text-align:right;font:inherit}.carttable{width:100%;border-collapse:collapse;white-space:normal}.carttable th{font-size:10px;padding:7px 4px}.carttable td{padding:8px 4px;font-size:12px;vertical-align:middle}.printnote{font-size:11px;color:var(--muted);margin-top:8px}
@media(max-width:900px){.sidebar{width:205px}.stats{grid-template-columns:repeat(2,1fr)}.two,.split{grid-template-columns:1fr}.content{padding:22px 18px}.topbar{padding:0 18px}}
@media(max-width:620px){.sidebar{display:none}.mobilemenu{display:inline-block}.topbar{height:62px}.content{padding:18px 12px}.stats{gap:9px}.card{padding:14px}.statvalue{font-size:22px}.productgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.pagehead{align-items:center}.pagehead h1{font-size:20px}.topright .pill{display:none}}
</style></head>
<body><div class="shell"><aside class="sidebar"><div class="brand"><div class="brandmark">S</div><div><strong>SELVALAKSHMI</strong><small>FIREWORKS POS · 2026</small></div></div><div class="navlabel">WORKSPACE</div><nav class="nav"><button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button><button data-page="billing"><span class="ico">▣</span>POS Billing</button><button data-page="inventory"><span class="ico">◫</span>Inventory</button><button data-page="import"><span class="ico">⇧</span>Excel Import</button><button data-page="purchases"><span class="ico">⇩</span>Purchases</button><div class="navlabel">MANAGEMENT</div><button data-page="reports"><span class="ico">▤</span>Sales & Reports</button><button data-page="users"><span class="ico">♙</span>Users & Roles</button><button data-page="settings"><span class="ico">⚙</span>Settings</button></nav><div class="sidefoot">Independent new POS workspace<br>Local prototype · Not connected to old site</div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobilemenu" id="mobileMenu">☰</button><div class="crumb" id="crumb">Dashboard</div></div><div class="topright"><span class="pill">● SYSTEM READY</span><span style="font-size:12px;color:var(--muted)">Administrator</span><div class="avatar">SA</div></div></header><div class="content" id="app"></div></main></div>
<script>
const $=s=>document.querySelector(s), money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const seed=[{sku:'SKY001',name:'Sky Shot',category:'Aerial',price:450,cost:300,stock:45},{sku:'CRK002',name:'Flower Pots',category:'Ground Chakkar',price:220,cost:140,stock:80},{sku:'SPK003',name:'Sparklers 10 cm',category:'Sparklers',price:90,cost:55,stock:120},{sku:'RKT004',name:'Rocket',category:'Aerial',price:180,cost:110,stock:65},{sku:'GRN005',name:'Ground Chakkar Big',category:'Ground Chakkar',price:160,cost:95,stock:38},{sku:'FNT006',name:'Colour Fountain',category:'Fountains',price:350,cost:230,stock:25}];
const SUPABASE_URL='https://sirsdkpfucycrwbhwbvu.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_kRATdJlC2plRWx7LUnaNPw_rG6pklgY';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let currentUser=null,currentRole=null,cloudReady=false;
let db=JSON.parse(localStorage.getItem('sla_fresh_pos_db')||'null')||{products:[],sales:[],purchases:[],users:[],settings:{shop:'SELVALAKSHMI AGENCY',gst:'',phone:''}};function save(){localStorage.setItem('sla_fresh_pos_db',JSON.stringify(db))}let page='dashboard',cart=[],pendingImport=[];
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#crumb').textContent=({dashboard:'Dashboard',billing:'POS Billing',inventory:'Inventory',import:'Excel Import',purchases:'Purchases',reports:'Sales & Reports',users:'Users & Roles',settings:'Settings'})[p];render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#mobileMenu').onclick=()=>document.querySelector('.sidebar').style.display='flex';
function head(title,sub,action=''){return `<div class="pagehead"><div><h1>${title}</h1><div class="sub">${sub}</div></div>${action}</div>`}
function render(){let html='';if(page==='dashboard')html=dashboard();if(page==='billing')html=billing();if(page==='inventory')html=inventory();if(page==='import')html=importPage();if(page==='purchases')html=purchases();if(page==='reports')html=reports();if(page==='users')html=users();if(page==='settings')html=settings();$('#app').innerHTML=html;bindPage()}
function dashboard(){let sales=db.sales.reduce((a,s)=>a+s.total,0),units=db.products.reduce((a,p)=>a+Number(p.stock||0),0),low=db.products.filter(p=>p.stock<=10).length,profit=db.sales.reduce((a,s)=>a+s.profit,0);return head('Good morning, Administrator','Here is your fireworks store overview for today.',`<button class="btn primary" onclick="go('billing')">＋ New Bill</button>`)+`<div class="grid stats"><div class="card"><span class="staticon">₹</span><div class="statlabel">Total Sales</div><div class="statvalue">${money(sales)}</div><div class="statnote">All recorded transactions</div></div><div class="card"><span class="staticon">▣</span><div class="statlabel">Products</div><div class="statvalue">${db.products.length}</div><div class="statnote">Active catalogue items</div></div><div class="card"><span class="staticon">◫</span><div class="statlabel">Units in Stock</div><div class="statvalue">${units.toLocaleString('en-IN')}</div><div class="statnote">Across all products</div></div><div class="card"><span class="staticon">↗</span><div class="statlabel">Recorded Gross Profit</div><div class="statvalue">${money(profit)}</div><div class="statnote">Based on entered cost prices</div></div></div><div class="grid two"><div class="card"><h3 class="sectiontitle">Recent transactions</h3>${db.sales.length?`<div class="tablewrap"><table><thead><tr><th>INVOICE</th><th>CUSTOMER</th><th>PAYMENT</th><th>TOTAL</th></tr></thead><tbody>${db.sales.slice(-6).reverse().map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.customer||'Walk-in')}</td><td><span class="tag green">${esc(s.payment)}</span></td><td><b>${money(s.total)}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No sales recorded yet. Start with a new bill.</div>'}</div><div class="card"><h3 class="sectiontitle">Inventory attention</h3>${low?db.products.filter(p=>p.stock<=10).map(p=>`<div class="cartline"><div><b>${esc(p.name)}</b><br><small>${esc(p.sku)}</small></div><span class="tag orange">${p.stock} left</span></div>`).join(''):'<div class="empty">No low-stock items. Inventory looks healthy.</div>'}<div style="margin-top:14px"><button class="btn" onclick="go('inventory')">View inventory →</button></div></div></div><div class="notice">Starter data is sample data stored in this browser only. Connect a production database and authentication before using this system for live transactions.</div>`}
function billing(){return head('POS Billing','Build a customer invoice with quick product selection.')+`<div class="split"><div class="card"><div class="toolbar"><input id="billSearch" class="field search" placeholder="Search product name or SKU..."><select id="billCat" class="field"><option value="">All categories</option>${[...new Set(db.products.map(p=>p.category))].map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="productgrid" id="productGrid">${productCards(db.products)}</div></div><div class="card"><h3 class="sectiontitle">Current bill</h3><div class="formrow"><div><label>CUSTOMER NAME</label><input id="customer" class="field" placeholder="Enter customer name" autocomplete="name"></div><div><label>CUSTOMER PHONE NUMBER</label><input id="customerPhone" class="field" type="tel" inputmode="tel" autocomplete="tel" maxlength="15" placeholder="Enter phone number"></div><div><label>PAYMENT</label><select id="payment" class="field"><option>Cash</option><option>UPI / GPay</option><option>Card</option><option>Bank Transfer</option></select></div></div><div id="cartLines" style="margin-top:15px">${cartHtml()}</div><div class="totals"><span>Subtotal</span><b id="subtotal">${money(cart.reduce((a,x)=>a+x.price*x.qty,0))}</b></div><div class="totals"><span>Item discounts</span><b id="itemDiscountTotal">${money(cart.reduce((a,x)=>a+Number(x.discount||0),0))}</b></div><div class="formrow"><div><label>DISCOUNT (₹)</label><input id="discount" type="number" min="0" value="0" class="field"></div><div><label>GST (%)</label><input id="gstRate" type="number" min="0" value="0" class="field"></div></div><div class="totals grand"><span>Grand total</span><b id="grandTotal">${money(cart.reduce((a,x)=>a+x.price*x.qty,0))}</b></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" style="flex:1" id="completeSale" ${cart.length?'':'disabled'}>Save invoice</button><button class="btn gold" style="flex:1" id="completePrint" ${cart.length?'':'disabled'}>Save & Print 58mm</button></div><div class="printnote">Mini Bluetooth printer: pair the printer with your Android phone, then select it in the system print dialog. 58mm receipt layout is supported.</div><div class="footerhint">Customer name and phone are optional. Enter them to save customer details with this invoice. Tax settings should be confirmed by your accountant before issuing GST invoices.</div></div></div>`}
function productCards(items){return items.map(p=>`<button class="product" data-add="${esc(p.sku)}"><strong>${esc(p.name)}</strong><small>${esc(p.sku)} · Stock ${p.stock}</small><div class="price">${money(p.price)}</div></button>`).join('')||'<div class="empty">No matching products.</div>'}function cartHtml(){return cart.length?`<div class="tablewrap"><table class="carttable"><thead><tr><th>ITEM</th><th>QTY</th><th>DISCOUNT ₹</th><th>AMOUNT</th><th></th></tr></thead><tbody>${cart.map((x,i)=>`<tr><td><b>${esc(x.name)}</b><br><small>${money(x.price)} each</small></td><td><input class="qtyctl" type="number" min="1" max="${Math.max(1,db.products.find(p=>p.sku===x.sku)?.stock||x.qty)}" value="${x.qty}" data-qty="${i}" aria-label="Quantity"></td><td><input class="linedisc" type="number" min="0" step="0.01" value="${Number(x.discount||0)}" data-linedisc="${i}" aria-label="Line discount"></td><td><b>${money(Math.max(0,x.price*x.qty-Number(x.discount||0)))}</b></td><td><button class="btn danger" data-remove="${i}" style="padding:3px 6px">×</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Your bill is empty. Select products to begin.'}
function inventory(){return head('Inventory management','Manage products, pricing, quantities and stock alerts.',`<button class="btn gold" onclick="go('import')">⇧ Import Excel</button> <button class="btn primary" id="addProduct">＋ Add product</button>`)+`<div class="card"><div class="toolbar"><input id="invSearch" class="field search" placeholder="Search name, SKU or category"><button class="btn" id="exportProducts">↓ Export Excel / CSV</button><button class="btn" id="templateBtn">↓ Import template</button></div><div class="tablewrap"><table><thead><tr><th>SKU</th><th>PRODUCT</th><th>CATEGORY</th><th>SELL PRICE</th><th>COST</th><th>STOCK</th><th>STATUS</th><th></th></tr></thead><tbody id="inventoryRows">${inventoryRows(db.products)}</tbody></table></div></div>`}
function inventoryRows(items){return items.map((p,i)=>`<tr><td><b>${esc(p.sku)}</b></td><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${money(p.price)}</td><td>${money(p.cost)}</td><td>${p.stock}</td><td><span class="tag ${p.stock<=10?'orange':'green'}">${p.stock<=10?'Low stock':'In stock'}</span></td><td><button class="btn" data-edit="${esc(p.sku)}">Edit</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No products found.</td></tr>'}
function importPage(){return head('Excel product import','Upload your catalogue, validate rows and preview changes before saving.')+`<div class="card"><div class="steps"><span class="step on">1 · Upload file</span><span class="step">2 · Validate & preview</span><span class="step">3 · Confirm import</span></div><div class="drop" id="drop"><div class="big">⇧</div><h3>Drop your Excel or CSV file here</h3><p>Supported formats: .xlsx, .xls, .csv</p><input type="file" id="excelFile" accept=".xlsx,.xls,.csv" class="hidden"><button class="btn primary" id="chooseFile">Choose file</button><div class="footerhint">Your file is read in this browser. It is not uploaded to a server.</div></div><div class="toolbar" style="margin-top:16px"><button class="btn" id="downloadTemplate">↓ Download Excel template</button><button class="btn" id="exportCatalogue">↓ Export current catalogue</button></div><div class="notice">Required columns: <b>SKU, Name, Category, Price, Cost, Stock</b>. Column headings are case-insensitive. SKU must be unique within the file. Existing SKUs are flagged and will not be overwritten unless you choose the update option.</div><div id="importResult"></div></div>`}
function purchases(){return head('Purchases & stock inward','Record supplier purchases to increase inventory.')+`<div class="grid two"><div class="card"><h3 class="sectiontitle">New purchase entry</h3><div class="formrow"><div><label>SUPPLIER</label><input id="supplier" class="field" placeholder="Supplier name"></div><div><label>REFERENCE / BILL NO.</label><input id="purchaseRef" class="field" placeholder="Supplier invoice"></div></div><div style="margin-top:12px"><label class="sub">PRODUCT</label><select id="purchaseProduct" class="field" style="width:100%">${db.products.map(p=>`<option value="${esc(p.sku)}">${esc(p.name)} (${esc(p.sku)})</option>`).join('')}</select></div><div class="formrow" style="margin-top:12px"><div><label>QUANTITY</label><input id="purchaseQty" type="number" min="1" value="1" class="field"></div><div><label>UNIT COST (₹)</label><input id="purchaseCost" type="number" min="0" class="field"></div></div><button class="btn primary" id="savePurchase" style="margin-top:15px">Save purchase & update stock</button></div><div class="card"><h3 class="sectiontitle">Recent purchases</h3>${db.purchases.length?db.purchases.slice(-8).reverse().map(p=>`<div class="cartline"><div><b>${esc(p.product)}</b><br><small>${esc(p.supplier)} · ${esc(p.ref)}</small></div><div><b>+${p.qty}</b><br><small>${money(p.qty*p.cost)}</small></div></div>`).join(''):'<div class="empty">No purchases recorded.</div>'}</div></div>`}
function reports(){let total=db.sales.reduce((a,s)=>a+s.total,0),profit=db.sales.reduce((a,s)=>a+s.profit,0);return head('Sales & reports','Review transactions, revenue and recorded gross profit.',`<button class="btn" id="exportSales">↓ Export sales CSV</button>`)+`<div class="grid stats"><div class="card"><div class="statlabel">Revenue</div><div class="statvalue">${money(total)}</div></div><div class="card"><div class="statlabel">Gross profit</div><div class="statvalue">${money(profit)}</div></div><div class="card"><div class="statlabel">Invoices</div><div class="statvalue">${db.sales.length}</div></div><div class="card"><div class="statlabel">Average bill</div><div class="statvalue">${money(db.sales.length?total/db.sales.length:0)}</div></div></div><div class="card"><h3 class="sectiontitle">Transaction register</h3><div class="tablewrap"><table><thead><tr><th>DATE</th><th>INVOICE</th><th>CUSTOMER NAME</th><th>PHONE</th><th>ITEMS</th><th>PAYMENT</th><th>REVENUE</th><th>GROSS PROFIT</th></tr></thead><tbody>${db.sales.slice().reverse().map(s=>`<tr><td>${new Date(s.date).toLocaleString('en-IN')}</td><td>${esc(s.id)}</td><td>${esc(s.customer||'Walk-in')}</td><td>${esc(s.customerPhone||'—')}</td><td>${s.items.reduce((a,x)=>a+x.qty,0)}</td><td>${esc(s.payment)}</td><td>${money(s.total)}</td><td>${money(s.profit)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No transactions yet.</td></tr>'}</tbody></table></div></div><div class="notice">Profit shown is an estimate from product cost values entered in the catalogue. It excludes overheads, tax adjustments, returns and other expenses.</div>`}
function users(){return head('Users & roles','Manage access levels for owners, managers and billing staff.')+`<div class="card"><h3 class="sectiontitle">Access roles</h3><div class="tablewrap"><table><thead><tr><th>USER</th><th>ROLE</th><th>STATUS</th><th>PERMISSIONS SUMMARY</th></tr></thead><tbody>${db.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.role)}</td><td><span class="tag green">${esc(u.status)}</span></td><td>${u.role==='Owner'?'Full access':u.role==='Manager'?'Sales, inventory, reports':'POS billing only'}</td></tr>`).join('')}</tbody></table></div><div class="notice">This prototype displays role concepts only. Enforced multi-user authentication and server-side permissions must be configured before production use.</div></div>`}
function settings(){return head('Store settings','Configure the shop details used in invoices.')+`<div class="card"><h3 class="sectiontitle">Business profile</h3><div class="formrow"><div><label>BUSINESS NAME</label><input id="shopName" class="field" value="${esc(db.settings.shop)}"></div><div><label>GSTIN</label><input id="shopGst" class="field" value="${esc(db.settings.gst)}" placeholder="Enter GSTIN"></div><div><label>CONTACT NUMBER</label><input id="shopPhone" class="field" value="${esc(db.settings.phone)}" placeholder="Phone number"></div></div><button class="btn primary" id="saveSettings" style="margin-top:15px">Save settings</button><div class="notice">This is a fresh standalone prototype. Data is saved only in this browser's local storage and is not yet backed up to a cloud database.</div></div>`}
  function bindPage(){if(page==='billing'){const grid=$('#productGrid');grid.onclick=e=>{let b=e.target.closest('[data-add]');if(!b)return;let p=db.products.find(x=>x.sku===b.dataset.add);if(!p||p.stock<=0)return alert('Out of stock');let x=cart.find(x=>x.sku===p.sku);if(x){if(x.qty>=p.stock)return alert('Not enough stock');x.qty++}else cart.push({...p,qty:1});$('#cartLines').innerHTML=cartHtml();$('#completeSale').disabled=!cart.length;$('#completePrint').disabled=!cart.length;calcTotal()};$('#billSearch').oninput=filterBill;$('#billCat').onchange=filterBill;$('#cartLines').onclick=e=>{let b=e.target.closest('[data-remove]');if(b){cart.splice(+b.dataset.remove,1);$('#cartLines').innerHTML=cartHtml();$('#completeSale').disabled=!cart.length;$('#completePrint').disabled=!cart.length;calcTotal()}};$('#cartLines').onchange=e=>{let q=e.target.closest('[data-qty]'),d=e.target.closest('[data-linedisc]');if(q){let i=+q.dataset.qty,x=cart[i],p=db.products.find(p=>p.sku===x.sku),v=Math.max(1,Math.floor(Number(q.value)||1));if(p&&v>p.stock){alert('Quantity exceeds available stock ('+p.stock+').');v=p.stock}x.qty=v}if(d){let x=cart[+d.dataset.linedisc],gross=x.price*x.qty;x.discount=Math.min(gross,Math.max(0,Number(d.value)||0))}$('#cartLines').innerHTML=cartHtml();calcTotal()};$('#discount').oninput=calcTotal;$('#gstRate').oninput=calcTotal;$('#completeSale').onclick=()=>completeSale(false);$('#completePrint').onclick=()=>completeSale(true)}
if(page==='inventory'){$('#invSearch').oninput=()=>{let q=$('#invSearch').value.toLowerCase();$('#inventoryRows').innerHTML=inventoryRows(db.products.filter(p=>(p.name+p.sku+p.category).toLowerCase().includes(q)))};$('#addProduct').onclick=()=>productDialog();$('#inventoryRows').onclick=e=>{let b=e.target.closest('[data-edit]');if(b)productDialog(b.dataset.edit)};$('#exportProducts').onclick=()=>exportCsv('selvalakshmi-products.csv',['SKU','Name','Category','Price','Cost','Stock'],db.products.map(p=>[p.sku,p.name,p.category,p.price,p.cost,p.stock]));$('#templateBtn').onclick=downloadTemplate}
if(page==='import'){$('#chooseFile').onclick=()=>$('#excelFile').click();$('#excelFile').onchange=e=>readExcel(e.target.files[0]);let d=$('#drop');d.ondragover=e=>{e.preventDefault();d.classList.add('drag')};d.ondragleave=()=>d.classList.remove('drag');d.ondrop=e=>{e.preventDefault();d.classList.remove('drag');readExcel(e.dataTransfer.files[0])};$('#downloadTemplate').onclick=downloadTemplate;$('#exportCatalogue').onclick=()=>exportCsv('current-catalogue.csv',['SKU','Name','Category','Price','Cost','Stock'],db.products.map(p=>[p.sku,p.name,p.category,p.price,p.cost,p.stock]))}
if(page==='purchases'){$('#savePurchase').onclick=()=>alert('Cloud purchase posting is not enabled yet. We will add a secure purchase transaction before using this screen. No stock has been changed.')}
if(page==='reports')$('#exportSales').onclick=()=>exportCsv('sales-register.csv',['Date','Invoice','Customer Name','Customer Phone','Payment','Items','Revenue','Gross Profit'],db.sales.map(s=>[s.date,s.id,s.customer,s.customerPhone||'',s.payment,s.items.map(x=>`${x.name} x${x.qty}`).join('; '),s.total,s.profit]));if(page==='settings')$('#saveSettings').onclick=()=>{db.settings={shop:$('#shopName').value,gst:$('#shopGst').value,phone:$('#shopPhone').value};save();alert('Settings saved.')};}
function filterBill(){let q=$('#billSearch').value.toLowerCase(),c=$('#billCat').value;$('#productGrid').innerHTML=productCards(db.products.filter(p=>(p.name+p.sku).toLowerCase().includes(q)&&(!c||p.category===c)))}function billAmounts(){let sub=cart.reduce((a,x)=>a+x.price*x.qty,0),lineDisc=cart.reduce((a,x)=>a+Math.min(x.price*x.qty,Math.max(0,Number(x.discount)||0)),0),billDisc=Math.min(Math.max(0,sub-lineDisc),Math.max(0,Number($('#discount')?.value)||0)),tax=Math.max(0,sub-lineDisc-billDisc)*Math.max(0,Number($('#gstRate')?.value)||0)/100;return{sub,lineDisc,billDisc,tax,total:sub-lineDisc-billDisc+tax}}function calcTotal(){let a=billAmounts();$('#subtotal').textContent=money(a.sub);$('#itemDiscountTotal').textContent=money(a.lineDisc);$('#grandTotal').textContent=money(a.total)}async function completeSale(shouldPrint=false){if(!cart.length)return;const invoice='SLA-'+Date.now().toString().slice(-8);const payload={p_invoice_no:invoice,p_customer_name:$('#customer').value.trim(),p_customer_phone:$('#customerPhone').value.trim(),p_payment:$('#payment').value,p_items:cart.map(x=>({sku:x.sku,qty:x.qty,discount:Number(x.discount)||0})),p_bill_discount:Math.max(0,Number($('#discount').value)||0),p_tax_rate:Math.max(0,Number($('#gstRate').value)||0)};const {data,error}=await supabaseClient.rpc('complete_pos_sale',payload);if(error){alert('Invoice was not saved. '+error.message);return}const result=data||{};const sale={id:result.invoice_no||invoice,date:new Date().toISOString(),customer:$('#customer').value.trim(),customerPhone:$('#customerPhone').value.trim(),payment:$('#payment').value,items:cart.map(x=>({sku:x.sku,name:x.name,qty:x.qty,price:x.price,cost:x.cost,discount:Number(x.discount)||0})),subtotal:Number(result.subtotal||0),itemDiscount:Number(result.item_discount||0),discount:Number(result.bill_discount||0),tax:Number(result.tax||0),total:Number(result.total||0),profit:Number(result.profit||0)};cart=[];await refreshCloudData();if(shouldPrint)printReceipt(sale);alert('Cloud invoice saved: '+sale.id+' · '+money(sale.total));go('dashboard')}
function printReceipt(sale){let w=window.open('','_blank','width=380,height=700');if(!w){alert('Allow pop-ups to print the receipt.');return}let rows=sale.items.map(x=>`<tr><td>${esc(x.name)}<br><small>${esc(x.sku)} · ${x.qty} × ${money(x.price)}</small></td><td style="text-align:right">${money(x.price*x.qty-Number(x.discount||0))}</td></tr>`).join('');w.document.write(`<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(sale.id)}</title><style>@page{size:58mm auto;margin:2mm}*{box-sizing:border-box}body{font:12px Arial,sans-serif;width:54mm;margin:0 auto;color:#000}h2{text-align:center;font-size:15px;margin:4px 0}p{text-align:center;margin:3px 0}hr{border:0;border-top:1px dashed #000;margin:7px 0}table{width:100%;border-collapse:collapse}td{padding:4px 0;vertical-align:top;font-size:11px}small{font-size:9px}.total{font-size:14px;font-weight:bold}</style></head><body><h2>${esc(db.settings.shop||'SELVALAKSHMI AGENCY')}</h2><p>SALES RECEIPT</p><hr><div>Invoice: ${esc(sale.id)}<br>Date: ${new Date(sale.date).toLocaleString('en-IN')}<br>Customer: ${esc(sale.customer||'Walk-in')}<br>Phone: ${esc(sale.customerPhone||'—')}</div><hr><table>${rows}</table><hr><div>Subtotal: ${money(sale.subtotal)}<br>Item discount: ${money(sale.itemDiscount||0)}<br>Bill discount: ${money(sale.discount||0)}<br>Tax: ${money(sale.tax||0)}</div><p class="total">TOTAL: ${money(sale.total)}</p><p>Payment: ${esc(sale.payment)}</p><hr><p>Thank you! Visit again.</p><script>window.onload=()=>{window.print()}<\/script></body></html>`);w.document.close()}
function productDialog(sku){let p=db.products.find(x=>x.sku===sku)||{sku:'',name:'',category:'',price:0,cost:0,stock:0};let vals=[['SKU','sku'],['Product name','name'],['Category','category'],['Selling price','price'],['Cost price','cost'],['Stock quantity','stock']];let form=vals.map(([label,key])=>`<label>${label}<input class="field" id="p_${key}" value="${esc(p[key])}" ${['price','cost','stock'].includes(key)?'type="number" min="0"':''} style="width:100%;margin:4px 0 10px"></label>`).join('');let box=document.createElement('div');box.style='position:fixed;inset:0;background:#101a2c88;z-index:10;display:grid;place-items:center;padding:15px';box.innerHTML=`<div class="card" style="width:min(480px,100%);max-height:90vh;overflow:auto"><h3>${sku?'Edit product':'Add product'}</h3>${form}<div class="toolbar"><button class="btn" id="cancelDlg">Cancel</button><button class="btn primary" id="saveProd">Save product</button></div></div>`;document.body.append(box);$('#cancelDlg').onclick=()=>box.remove();$('#saveProd').onclick=async()=>{let n={};vals.forEach(([l,k])=>n[k]=$('#p_'+k).value);n.price=Number(n.price);n.cost=Number(n.cost);n.stock=Number(n.stock);if(!n.sku||!n.name)return alert('SKU and product name are required');let existing=db.products.findIndex(x=>x.sku===sku);if(db.products.some((x,i)=>x.sku===n.sku&&i!==existing))return alert('SKU already exists');const {error}=await supabaseClient.from('products').upsert(n,{onConflict:'sku'});if(error)return alert('Cloud save failed: '+error.message);await refreshCloudData();box.remove();render()}}
function downloadTemplate(){exportCsv('selvalakshmi-product-import-template.csv',['SKU','Name','Category','Price','Cost','Stock'],[['SKY001','Sky Shot','Aerial',450,300,45],['CRK002','Flower Pots','Ground Chakkar',220,140,80]])}function exportCsv(name,headers,rows){let csv=[headers,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function readExcel(file){if(!file)return;if(!window.XLSX){alert('Excel reader could not load. Check internet connection and retry.');return}let reader=new FileReader();reader.onload=e=>{try{let wb=XLSX.read(e.target.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});let norm=s=>String(s).trim().toLowerCase().replace(/[ _-]/g,'');let parsed=rows.map((r,i)=>{let o={};Object.keys(r).forEach(k=>o[norm(k)]=r[k]);return{row:i+2,sku:String(o.sku??'').trim(),name:String(o.name??o.productname??'').trim(),category:String(o.category??'Uncategorised').trim(),price:Number(o.price??o.sellingprice),cost:Number(o.cost??o.costprice??0),stock:Number(o.stock??o.quantity)}});let seen=new Set(),existing=new Set(db.products.map(p=>p.sku));pendingImport=parsed.map(p=>{let errors=[];if(!p.sku)errors.push('Missing SKU');if(!p.name)errors.push('Missing name');if(!Number.isFinite(p.price)||p.price<0)errors.push('Invalid price');if(!Number.isFinite(p.cost)||p.cost<0)errors.push('Invalid cost');if(!Number.isInteger(p.stock)||p.stock<0)errors.push('Stock must be a whole number');if(seen.has(p.sku))errors.push('Duplicate SKU in file');seen.add(p.sku);return{...p,errors,exists:existing.has(p.sku)}});showImportPreview(file.name)}catch(err){alert('Could not read file: '+err.message)}};reader.readAsArrayBuffer(file)}
function showImportPreview(filename){let valid=pendingImport.filter(p=>!p.errors.length),bad=pendingImport.filter(p=>p.errors.length);$('#importResult').innerHTML=`<div class="notice success">Loaded <b>${esc(filename)}</b>: ${pendingImport.length} rows · ${valid.length} valid · ${bad.length} with errors · ${valid.filter(p=>p.exists).length} existing SKUs</div><div class="toolbar"><label class="sub"><input type="checkbox" id="updateExisting"> Update existing SKUs (unchecked = skip)</label></div><div class="tablewrap"><table><thead><tr><th>ROW</th><th>SKU</th><th>PRODUCT</th><th>PRICE</th><th>COST</th><th>STOCK</th><th>RESULT</th></tr></thead><tbody>${pendingImport.slice(0,100).map(p=>`<tr><td>${p.row}</td><td>${esc(p.sku)}</td><td>${esc(p.name)}</td><td>${money(p.price)}</td><td>${money(p.cost)}</td><td>${p.stock}</td><td>${p.errors.length?`<span class="tag orange">${esc(p.errors.join(', '))}</span>`:p.exists?'<span class="tag orange">Existing SKU</span>':'<span class="tag green">Ready</span>'}</td></tr>`).join('')}</tbody></table></div>${pendingImport.length>100?`<p class="footerhint">Showing first 100 rows of ${pendingImport.length}.</p>`:''}<div class="toolbar" style="margin-top:15px"><button class="btn primary" id="commitImport" ${valid.length?'':'disabled'}>Confirm import (${valid.length} valid rows)</button><button class="btn" id="clearImport">Clear preview</button></div><p class="footerhint">Rows with validation errors are skipped. Existing SKUs are skipped unless Update existing SKUs is selected. Import changes are applied only after confirmation.</p>`;$('#commitImport').onclick=async()=>{let update=$('#updateExisting').checked,added=0,updated=0,skipped=0;for(const p of pendingImport){if(p.errors.length){skipped++;continue}let exists=db.products.some(x=>x.sku===p.sku);if(exists&&!update){skipped++;continue}const row={sku:p.sku,name:p.name,category:p.category,price:p.price,cost:p.cost,stock:p.stock};const {error}=await supabaseClient.from('products').upsert(row,{onConflict:'sku'});if(error){alert('Import stopped at row '+p.row+': '+error.message);return}if(exists)updated++;else added++}await refreshCloudData();$('#importResult').innerHTML=`<div class="notice success"><b>Cloud import completed.</b> Added: ${added} · Updated: ${updated} · Skipped: ${skipped}. <button class="btn" onclick="go('inventory')">Open inventory</button></div>`;pendingImport=[]};$('#clearImport').onclick=()=>{$('#importResult').innerHTML='';pendingImport=[]}}

function showLogin(message='Sign in to your Selvalakshmi POS cloud workspace.'){document.querySelector('.shell').style.display='none';let old=document.getElementById('authGate');if(old)old.remove();let gate=document.createElement('div');gate.id='authGate';gate.style='min-height:100vh;display:grid;place-items:center;padding:20px;background:#f4f6fa';gate.innerHTML=`<div class="card" style="width:min(420px,100%);padding:28px"><div class="brandmark" style="margin-bottom:16px">S</div><h2 style="margin:0 0 6px">SELVALAKSHMI AGENCY</h2><p class="sub">Fireworks POS · Secure cloud login</p><div class="notice">${esc(message)}</div><form id="loginForm"><label class="formrow" style="display:block;margin:12px 0">EMAIL ADDRESS<input id="loginEmail" class="field" type="email" required autocomplete="username" style="width:100%;margin-top:5px"></label><label style="display:block;margin:12px 0">PASSWORD<input id="loginPassword" class="field" type="password" required autocomplete="current-password" style="width:100%;margin-top:5px"></label><button class="btn primary" id="loginButton" style="width:100%;margin-top:12px">Sign in</button></form><p class="footerhint">Use the user account created in Supabase Authentication. Do not share your password.</p></div>`;document.body.append(gate);$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginButton').disabled=true;$('#loginButton').textContent='Signing in…';const {error}=await supabaseClient.auth.signInWithPassword({email:$('#loginEmail').value.trim(),password:$('#loginPassword').value});if(error){$('#loginButton').disabled=false;$('#loginButton').textContent='Sign in';alert(error.message)}}}
async function refreshCloudData(){const [pr,sr,ir,ur,por]=await Promise.all([supabaseClient.from('products').select('*').order('name'),supabaseClient.from('sales').select('*').order('created_at',{ascending:false}),supabaseClient.from('sale_items').select('*'),supabaseClient.from('profiles').select('id,full_name,role'),supabaseClient.from('purchases').select('*').order('created_at',{ascending:false})]);for(const r of [pr,sr,ir,ur])if(r.error)throw r.error;if(por.error&&currentRole!=='Cashier')throw por.error;db.products=(pr.data||[]).map(p=>({sku:p.sku,name:p.name,category:p.category,price:Number(p.price),cost:Number(p.cost),stock:Number(p.stock)}));const items=ir.data||[];db.sales=(sr.data||[]).map(s=>({id:s.invoice_no,date:s.created_at,customer:s.customer_name||'',customerPhone:s.customer_phone||'',payment:s.payment,subtotal:Number(s.subtotal),itemDiscount:Number(s.item_discount),discount:Number(s.bill_discount),tax:Number(s.tax),total:Number(s.total),profit:Number(s.profit),items:items.filter(i=>i.sale_id===s.id).map(i=>({sku:i.sku,name:i.product_name,qty:Number(i.quantity),price:Number(i.price),cost:Number(i.cost),discount:Number(i.discount)}))}));db.purchases=(por.data||[]).map(p=>({supplier:p.supplier,ref:p.reference_no,product:'Purchase record',qty:0,cost:0,date:p.created_at}));db.users=(ur.data||[]).map(u=>({name:u.full_name||u.id,role:u.role,status:'Active'}));cloudReady=true}
async function enterWorkspace(user){currentUser=user;const {data:profile,error:profileError}=await supabaseClient.from('profiles').select('role,full_name').eq('id',user.id).single();if(profileError){await supabaseClient.auth.signOut();showLogin('Your profile could not be loaded: '+profileError.message);return}currentRole=profile.role;try{await refreshCloudData()}catch(e){showLogin('Cloud data could not be loaded: '+e.message);return}let gate=document.getElementById('authGate');if(gate)gate.remove();document.querySelector('.shell').style.display='flex';const top=$('.topright');top.innerHTML=`<span class="pill">● CLOUD CONNECTED</span><span style="font-size:12px;color:var(--muted)">${esc(profile.full_name||user.email)} · ${esc(currentRole)}</span><button class="btn" id="logoutBtn">Sign out</button>`;$('#logoutBtn').onclick=async()=>{await supabaseClient.auth.signOut();currentUser=null;currentRole=null;showLogin()};render()}
async function bootstrapSupabase(){if(!window.supabase){showLogin('Supabase library failed to load. Check your internet connection and reload.');return}const {data,error}=await supabaseClient.auth.getSession();if(error){showLogin(error.message);return}if(data.session)await enterWorkspace(data.session.user);else showLogin()}
bootstrapSupabase();
